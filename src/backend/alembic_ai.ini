# AI Engine migrations (schema `agent`, version table `agent.alembic_version_ai`).
# Independent of the Business environment in alembic.ini; never touches `business`/`auth`.
#   uv run alembic -c alembic_ai.ini upgrade head
[alembic]
script_location = %(here)s/migrations_ai
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
