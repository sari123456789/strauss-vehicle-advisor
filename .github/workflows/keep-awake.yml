# Pings the Render free-tier API every 10 minutes so it doesn't spin down after 15 idle minutes.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://strauss-vehicle-advisor-api.onrender.com/api/v1/health
