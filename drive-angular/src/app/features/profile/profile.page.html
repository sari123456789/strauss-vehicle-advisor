<section class="container narrow"><drive-heading title="המספרים שמאחורי הבחירה." subtitle="עדכנו את הנתונים כדי שההשוואה תתאים לכם."/><form class="panel profile-form" (ngSubmit)="save()"><div class="tabs"><span class="active">נתוני שכר</span><span>רכב נוכחי: רכב חברה</span><span>הפרשות וניכויים</span></div><div class="grid two"><label>שכר בסיס חודשי (₪)<input type="number" name="salary" [(ngModel)]="model.salary" min="0" required></label><label>רכיבי שכר נוספים (₪)<input type="number" name="additional" [(ngModel)]="model.additional" min="0" required></label><label>קבוצת זכאות<select name="group" [(ngModel)]="model.group">@for(g of ['א','ב','ג','ד'];track g){<option>{{g}}</option>}</select></label><label>נקודות זיכוי<input type="number" name="credits" [(ngModel)]="model.credits" step="0.25" min="0" required></label><label>פנסיית עובד (%)<input type="number" name="pension" [(ngModel)]="model.pension" step="0.1" min="0" max="100" required></label><label>קרן השתלמות עובד (%)<input type="number" name="fund" [(ngModel)]="model.fund" step="0.1" min="0" max="100" required></label></div><label class="upload">העלאת תלוש או חוזה — אופציונלי<input type="file" accept=".pdf,.png,.jpg,.jpeg" (change)="fileChange($event)"><span class="muted">{{file||'הקובץ אינו נשלח לשרת במצב הדגמה'}}</span></label><button class="primary">שמירה והמשך ←</button></form></section>
