<section class="login"><div><drive-heading title="הבחירה הבאה מתחילה כאן." subtitle="כניסה ליועץ הרכב שלך"/><form (ngSubmit)="login()"><label>כתובת מייל ארגונית<input type="email" name="email" [(ngModel)]="email" required placeholder="name@company.co.il" autocomplete="email"></label><label>סיסמה<input type="password" name="password" [(ngModel)]="password" required minlength="4" autocomplete="current-password"></label><label>תפקיד בהדגמה<select name="role" [(ngModel)]="role"><option value="employee">עובד</option><option value="representative">נציג</option></select></label><button class="primary full">כניסה להדגמה ←</button><p class="muted">מצב הדגמה מקומי — אין אימות ארגוני פעיל.</p></form></div><drive-car/></section>
