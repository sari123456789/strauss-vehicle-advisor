<section class="login"><div><drive-heading title="הבחירה הבאה מתחילה כאן." subtitle="כניסה ליועץ הרכב שלך"/><form (ngSubmit)="submit()"><label>שם משתמש<input type="text" name="login" [(ngModel)]="login" required autocomplete="username" data-testid="login" placeholder="לדוגמה e001" dir="ltr"></label><label>סיסמה<input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" dir="ltr" data-testid="password"></label>@if(error()){<p class="notice amber" role="alert">{{error()}}</p>}<button class="primary full" [disabled]="busy()" data-testid="sign-in">{{busy()?'מתחברים…':'כניסה ←'}}</button><p class="muted">משתמשי הדגמה בלבד. הנתונים אינם נתוני שכר אמיתיים.</p></form></div><drive-car/></section>
