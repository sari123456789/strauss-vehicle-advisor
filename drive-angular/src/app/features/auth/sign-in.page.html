<section class="login"><div><drive-heading title="הבחירה הבאה מתחילה כאן." subtitle="כניסה ליועץ הרכב שלך"/><form (ngSubmit)="login()"><label>שם משתמש<input type="text" name="email" [(ngModel)]="email" required autocomplete="username" data-testid="login"></label><label>סיסמה<input type="password" name="password" [(ngModel)]="password" required minlength="4" autocomplete="current-password" data-testid="password"></label><label>תפקיד בהדגמה<select name="role" [(ngModel)]="role"><option value="employee">עובד</option><option value="representative">נציג</option></select></label>@if(error()){<p class="muted" role="alert">{{error()}}</p>}<button class="primary full" [disabled]="busy()" data-testid="sign-in">כניסה ←</button><p class="muted">עובדים נכנסים עם חשבון אמיתי; תצוגת הנציג עדיין בהדגמה מקומית.</p></form></div><drive-car/></section>
