<section class="container"><drive-heading title="הבחירות שבדקת, במקום אחד." subtitle="אפשר לחזור להשוואה ולהמשיך מאותה נקודה."/><a class="primary" routerLink="/catalog">+ השוואה חדשה</a><div class="table-wrap"><table><thead><tr><th>תאריך</th><th>חלופה</th><th>סטטוס</th><th>פעולה</th></tr></thead><tbody>@for(c of store.history();track c.id){<tr><td>{{c.date}}</td><td>{{c.vehicleId==='ev'?'מעבר לחשמלי':c.vehicleId}}</td><td><span [class.positive]="c.status==='complete'" class="gold">{{c.status==='complete'?'הושלמה':'ממתינה למידע'}}</span></td><td><button class="outline" (click)="open(c.vehicleId)">פתיחת השוואה ←</button></td></tr>}@empty{<tr><td colspan="4" class="empty">עוד אין השוואות שמורות. שמרו את ההשוואה הראשונה שלכם ממסך ההשוואה.</td></tr>}</tbody></table></div></section>
