<section class="hero" aria-labelledby="home-title">
  <img
    class="hero__photo"
    src="/assets/home/hero-car-1240.webp"
    srcset="/assets/home/hero-car-800.webp 800w, /assets/home/hero-car-1240.webp 1240w, /assets/home/hero-car-1672.webp 1672w"
    sizes="(min-width: 1024px) 77vw, 100vw"
    width="1672"
    height="941"
    alt="רכב חשמלי כסוף בתאורת סטודיו"
    fetchpriority="high"
    decoding="async" />

  <div class="hero__copy">
    <p class="hero__eyebrow">הבחירה שלך. המספרים ברורים.</p>
    <h1 class="hero__title" id="home-title">
      <span class="hero__line">הרכב הבא שלך.</span>
      <span class="hero__line hero__line--accent">מה יקרה לנטו שלך?</span>
    </h1>
    <p class="hero__lead">משווים רכבים, מבינים את ההשפעה על השכר ובוחרים נכון.</p>
    <a class="hero__cta" routerLink="/advisor">
      <span>בואו נבדוק את הנטו שלי</span>
      <svg class="hero__cta-arrow" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
        <path d="M23 8H2M8 1.5L1.5 8 8 14.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
    <a class="hero__link" routerLink="/catalog">לצפייה ברכבים</a>
  </div>

  <dr-slide-indicator class="hero__indicator" />
</section>

<section class="options" aria-labelledby="options-title">
  <h2 class="options__title" id="options-title">כל האפשרויות, בתמונה אחת</h2>
  <ul class="options__list">
    <li>
      <dr-option-card
        variant="current"
        title="הרכב הנוכחי"
        label="נטו חודשי משוער"
        link="/comparison"
        imageSrc="/assets/home/car-current.webp"
        [imageWidth]="278"
        [imageHeight]="172" />
    </li>
    <li>
      <dr-option-card
        variant="electric"
        title="מעבר לחשמלי"
        label="נטו חודשי משוער"
        link="/catalog"
        [selected]="true"
        imageSrc="/assets/home/car-electric.webp"
        [imageWidth]="287"
        [imageHeight]="172" />
    </li>
    <li>
      <dr-option-card variant="waiver" title="ויתור על רכב" label="נטו חודשי משוער" link="/comparison" />
    </li>
  </ul>
</section>
