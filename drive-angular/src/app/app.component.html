<a class="skip-link" href="#main-content" (click)="skipToMain($event, main)">דילוג לתוכן הראשי</a>
<dr-site-header [variant]="isHome() ? 'overlay' : 'default'" />
<main id="main-content" #main tabindex="-1">
  <router-outlet />
</main>
@if (!isChat()) {
  <dr-site-footer />
}
@if (showChatButton()) {
  <a class="chat-fab" routerLink="/advisor" aria-label="חזרה לשיחה עם היועץ">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>חזרה לשיחה</span>
  </a>
}
