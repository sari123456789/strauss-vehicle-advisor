<dialog
  #dialog
  class="sheet"
  [class.sheet--bottom]="placement() === 'bottom'"
  [class.sheet--side]="placement() === 'side'"
  [attr.aria-labelledby]="headingId"
  (close)="onDialogClose()"
  (keydown)="onDialogKeydown($event)"
  (click)="onDialogClick($event)">
  <div class="sheet__panel">
    <span class="sheet__handle" aria-hidden="true"></span>
    <header class="sheet__header">
      <h2 class="sheet__title" [id]="headingId">{{ title() }}</h2>
      <button type="button" class="btn btn--ghost btn--icon sheet__close" (click)="close()" [attr.aria-label]="closeLabel()">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </header>
    <div class="sheet__body">
      <ng-content />
    </div>
  </div>
</dialog>
